[workspace]
resolver = "3"
members = [
    "crates/slayer-core",
    "crates/slayer-quant",
    "crates/slayer-engines",
    "crates/slayer-feed",
    "crates/slayer-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "LicenseRef-Proprietary"
repository = "https://github.com/hotterthenheat/zmjslayers"

[workspace.dependencies]
slayer-core = { path = "crates/slayer-core" }
slayer-quant = { path = "crates/slayer-quant" }
slayer-engines = { path = "crates/slayer-engines" }
slayer-feed = { path = "crates/slayer-feed" }

serde = { version = "1", features = ["derive"] }
# float_roundtrip: guarantee exact f64 parse round-trip. Without it serde_json's
# fast parser can drift 1 ULP, which breaks wire fidelity and cross-language
# golden parity for a trading protocol.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
